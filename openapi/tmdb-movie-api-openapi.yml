8,"original_language":"en","original_title":"Winnie the Pooh: Blood and Honey","overview":"Christopher Robin is headed off to college and he has abandoned his old friends, Pooh and Piglet, which then leads to the duo embracing their inner monsters.","popularity":690.338,"poster_path":"/ewF3IlGscc7FjgGEPcQvZsAsgAW.jpg","release_date":"2023-01-27","title":"Winnie the Pooh: Blood and Honey","video":false,"vote_average":5.8,"vote_count":517},{"adult":false,"backdrop_path":"/dlrWhn0G3AtxYUx2D9P2bmzcsvF.jpg","genre_ids":[878,27,35],"id":536554,"original_language":"en","original_title":"M3GAN","overview":"A brilliant toy company roboticist uses artificial intelligence to develop M3GAN, a life-like doll programmed to emotionally bond with her newly orphaned niece. But when the doll''s programming works too well, she becomes overprotective of her new friend with terrifying results.","popularity":715.958,"poster_path":"/d9nBoowhjiiYc4FBNtQkPY7c11H.jpg","release_date":"2022-12-28","title":"M3GAN","video":false,"vote_average":7.4,"vote_count":2428},{"adult":false,"backdrop_path":"/aHcWyh0n4YbBy9gxYCDlgsNVS3M.jpg","genre_ids":[27,9648,53],"id":631842,"original_language":"en","original_title":"Knock at the Cabin","overview":"While vacationing at a remote cabin, a young girl and her two fathers are taken hostage by four armed strangers who demand that the family make an unthinkable choice to avert the apocalypse. With limited access to the outside world, the family must decide what they believe before all is lost.","popularity":528.208,"poster_path":"/dm06L9pxDOL9jNSK4Cb6y139rrG.jpg","release_date":"2023-02-01","title":"Knock at the Cabin","video":false,"vote_average":6.4,"vote_count":1337},{"adult":false,"backdrop_path":"/70aVSo3fuZ94jyQ3rT64afEf8lV.jpg","genre_ids":[16,12,35,10751,14],"id":676710,"original_language":"en","original_title":"The Amazing Maurice","overview":"Maurice is a streetwise ginger cat who comes up with a money-making scam by befriending a group of self-taught talking rats. When Maurice and the rodents meet a bookworm called Malicia, their little con soon goes down the drain.","popularity":515.629,"poster_path":"/ydhZeUjbzVEFclUpMhLfDZSavUY.jpg","release_date":"2022-12-16","title":"The Amazing Maurice","video":false,"vote_average":7,"vote_count":61},{"adult":false,"backdrop_path":"/zGoZB4CboMzY1z4G3nU6BWnMDB2.jpg","genre_ids":[28,35,10749],"id":758009,"original_language":"en","original_title":"Shotgun Wedding","overview":"Darcy and Tom gather their families for the ultimate destination wedding but when the entire party is taken hostage, “’Til Death Do Us Part” takes on a whole new meaning in this hilarious, adrenaline-fueled adventure as Darcy and Tom must save their loved ones—if they don’t kill each other first.","popularity":467.041,"poster_path":"/t79ozwWnwekO0ADIzsFP1E5SkvR.jpg","release_date":"2022-12-28","title":"Shotgun Wedding","video":false,"vote_average":6.3,"vote_count":775},{"adult":false,"backdrop_path":"/ttXABm22Vu9MsQjDAF3Lx2nUPy0.jpg","genre_ids":[35,28],"id":1101799,"original_language":"es","original_title":"Fuga de Reinas","overview":"When four women finally take the road trip they planned in high school, they have no idea of the things they''ll bump into sometimes literally.","popularity":403.116,"poster_path":"/oUmuwUIofGsgOr05kieD3Q8ELEO.jpg","release_date":"2023-04-14","title":"Queens on the Run","video":false,"vote_average":7.2,"vote_count":59},{"adult":false,"backdrop_path":"/94TIUEhuwv8PhdIADEvSuwPljS5.jpg","genre_ids":[10752,28],"id":840326,"original_language":"fi","original_title":"Sisu","overview":"Deep in the wilderness of Lapland, Aatami Korpi is searching for gold but after he stumbles upon Nazi patrol, a breathtaking and gold-hungry chase through the destroyed and mined Lapland wilderness begins.","popularity":364.899,"poster_path":"/dHx5yuBb05U9vNaNhIBD7jWyxPk.jpg","release_date":"2023-01-27","title":"Sisu","video":false,"vote_average":6.9,"vote_count":16}],"total_pages":87,"total_resul