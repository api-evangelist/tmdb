upernatural threat they encounter along the way. ","popularity":361.403,"poster_path":"/KoYWXbnYuS3b0GyQPkbuexlVK9.jpg","first_air_date":"2005-09-13","name":"Supernatural","vote_average":8.304,"vote_count":6650},{"adult":false,"backdrop_path":"/mCwQJqyuCFlbFyJR5sWg3PqtHEN.jpg","genre_ids":[18,80],"id":40008,"origin_country":["US"],"original_language":"en","original_name":"Hannibal","overview":"Both a gift and a curse, Graham has the extraordinary ability to think like his prey—he sees what they see, feels what they feel. But while Graham is pursuing an especially troubling, cannibalistic murderer, Special Agent Jack Crawford teams him with a highly respected psychiatrist – a man with a taste for the criminal minded – Dr. Hannibal Lecter.","popularity":55.286,"poster_path":"/imzvb941su6uhQ158GGurk7vF28.jpg","first_air_date":"2013-04-04","name":"Hannibal","vote_average":8.222,"vote_count":2011},{"adult":false,"backdrop_path":"/2yDV0xLyqW88dn5qE7YCRnoYmfy.jpg","genre_ids":[18,10768],"id":4613,"origin_country":["US"],"original_language":"en","original_name":"Band of Brothers","overview":"Drawn from interviews with survivors of Easy Company, as well as their journals and letters, Band of Brothers chronicles the experiences of these men from paratrooper training in Georgia through the end of the war. As an elite rifle company parachuting into Normandy early on D-Day morning, participants in the Battle of the Bulge, and witness to the horrors of war, the men of Easy knew extraordinary bravery and extraordinary fear - and became the stuff of legend. Based on Stephen E. Ambrose''s acclaimed book of the same name.","popularity":56.008,"poster_path":"/pGzV187ogXzgJrvPRy2YPi29ofH.jpg","first_air_date":"2001-09-09","name":"Band of Brothers","vote_average":8.457,"vote_count":2956}],"total_pages":4,"total_results":68}'
