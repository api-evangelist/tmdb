6MeoJDXrD.jpg","genre_ids":[35],"id":58942,"origin_country":["US"],"original_language":"en","original_name":"The Michael J. Fox Show","overview":"Look who’s making the news again! One of NY’s most beloved news anchors, Mike Henry (Michael J. Fox), put his career on hold to spend more time with his family and focus on his health after he was diagnosed with Parkinson’s. But now five years later, with the kids busy growing up and Mike growing restless, it just might be time for him to get back to work. Having never wanted Mike to leave in the first place, his old boss Harris Green jumped at the chance to get him back on TV. The trick, as it’s always been, was to make Mike think it was his idea. After several – okay, many - failed attempts, Mike’s family, anxious to see him out of the house, finally succeeded in getting him to “run into” Green. Now their plan is in motion. He’ll be back to juggling home, family, and career, just like the old days – only better.","popularity":6.79,"poster_path":"/vHFM0GjFlqi8GpLECq2mF47V0LL.jpg","first_air_date":"2013-09-26","name":"The Michael J. Fox Show","vote_average":5.8,"vote_count":47},{"adult":false,"backdrop_path":"/qzBaQAhGk5Rp08KX7EUTSVia6bZ.jpg","genre_ids":[35],"id":51320,"origin_country":["US"],"original_language":"en","original_name":"The Millers","overview":"A divorced reporter, looking forward to the single life, finds his parents'' marital problems derail his plans.","popularity":7.507,"poster_path":"/y3d7thiGCbYfFCJfKNyVX9GrqQo.jpg","first_air_date":"2013-10-03","name":"The Millers","vote_average":5.817,"vote_count":30},{"adult":false,"backdrop_path":"/nywPcsxgt1PdEG7BqUYBIUTPNGx.jpg","genre_ids":[18],"id":44840,"origin_country":["US"],"original_language":"en","original_name":"Mob City","overview":"The true story of a decades-long conflict between the Los Angeles Police Department, under the determined leadership of Police Chief William Parker, and ruthless criminal elements led by Mickey Cohen, a one-time boxer who rose to the top of L.A.''s criminal world. The series is a fast-paced crime drama set in Los Angeles during the 1940s and ''50s. It''s a world of glamorous movie stars, powerful studio heads, returning war heroes, a powerful and corrupt police force and an even more dangerous criminal network determined to make L.A. its West Coast base.","popularity":6.096,"poster_path":"/6W6Xhj1KOIcBtASHHhmpyySoUik.jpg","first_air_date":"2013-12-04","name":"Mob City","vote_average":6.934,"vote_count":61},{"adult":false,"backdrop_path":"/g61rFsbIVoN8tb08nChex1FERQu.jpg","genre_ids":[18],"id":32940,"origin_country":["GB"],"original_language":"en","original_name":"Accused","overview":"Accused is a British television anthology series created by Jimmy McGovern. The drama series first aired on 15 November 2010 on BBC One and has run for two series. Each episode follows a different character as they await their verdict in court, and tells the story behind how they find themselves accused. The series has featured actors and actresses such as Christopher Eccleston, Benjamin Smith, Juliet Stevenson, Andy Serkis, Marc Warren, Naomie Harris, Sean Bean and Anne-Marie Duff as the accused in each episode.\n\nThe series follows previous drama series by McGovern, including anthology series The Street and Moving On. After the cancellation of The Street in 2009 by Granada Television, McGovern formed RSJ Films to produce independent drama programmes and consequently devised the Accused anthology series. Accused is written by McGovern, Danny Brocklehurst and Alice Nutter and is filmed in Manchester. In 2011 it won an International Emmy for best drama series.","popularity":11.661,"poster_path":"/nfeqQPO2hpw0NYG6xiK0gWUC2l0.jpg","first_air_date":"2010-11-15","name":"Accused","vote_average":8.529,"vote_count":35},{"adult":false,"backdrop_path":"/qPvvbMIe8pOHGQ0e8bq1Ely7qGL.jpg","genre_ids":[18,10759],"id":32573,"origin_country":["GB"],"original_language":"en","original_name":"Strike Back","overview":"The series follows John Porter, a former British Special Forces soldier, who is drafted back into service by Section 20, a fictional branch of the Secret Intelligence Service.","popularity":45.283,"poster_path":"/rFy3EOZrRymjkalih7W3v8kSVWr.jpg","first_air_date":"2010-05-05","name":"Strike Back","vote_average":7.396,"vote_count":293}],"total_pages":17,"total_results":325}'
